server:
  address: 127.0.0.1
  port: ${FIELDWARD_API_PORT:18080}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: FIELDWARD_SESSION
        http-only: true
        same-site: lax
        secure: ${FIELDWARD_SECURE_COOKIE:true}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    jdbc:
      initialize-schema: never
  application:
    name: fieldward
  config:
    import: 'optional:file:./.env[.properties],optional:file:../.env[.properties]'
  datasource:
    url: ${FIELDWARD_DB_URL}
    username: ${FIELDWARD_DB_USER}
    password: ${FIELDWARD_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  mvc:
    problemdetails:
      enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  api-docs:
    path: /api/openapi

fieldward:
  admin:
    email: ${FIELDWARD_ADMIN_EMAIL:}
    password: ${FIELDWARD_ADMIN_PASSWORD:}

  mentor:
    endpoint: ${FIELDWARD_MENTOR_ENDPOINT:https://api.xiaomimimo.com/v1/chat/completions}
    api-key: ${MIMO_API_KEY:}
    model: ${FIELDWARD_MENTOR_MODEL:mimo-v2.6-pro}
